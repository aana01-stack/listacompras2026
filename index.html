<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minha Lista | 2026</title>
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/css/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
    <!-- Indicador de Status Offline -->
    <div id="offlineIndicator" class="offline-indicator hidden">
        <span class="offline-icon">📡</span>
        <span class="offline-text">Você está offline</span>
        <span class="offline-subtext">Alterações serão sincronizadas quando conectar</span>
    </div>

    <div class="app-wrapper">
        <!-- Header Glass -->
        <header class="app-header">
            <div class="header-content">
                <div class="user-greeting">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div class="greeting-text">
                        <span class="greeting-label">Olá,</span>
                        <span class="user-name" id="userDisplayName">Usuário</span>
                    </div>
                </div>
                <div class="header-actions">
                    <div id="syncStatus" class="sync-status synced" title="Sincronizado">
                        <span class="sync-icon">☁️</span>
                    </div>
                    <button class="logout-btn" onclick="logout()" aria-label="Sair da conta">
                        <span class="logout-icon">🚪</span>
                        <span class="logout-text">Sair</span>
                    </button>
                </div>
            </div>
            <h1 class="page-title">
                <span class="title-icon">🛒</span>
                Minha Lista de Compras
            </h1>
        </header>

        <!-- Container Principal -->
        <main class="main-content">
            <!-- Área da Lista -->
            <div class="list-container">
                <div class="list-header">
                    <h2 class="section-title">Itens da Lista</h2>
                    <div class="list-stats">
                        <span class="item-count" id="itemCount">0 itens</span>
                        <select id="categoryFilter" class="category-filter" aria-label="Filtrar por categoria">
                            <option value="all">Todas categorias</option>
                            <option value="hortifruti">🍎 Hortifruti</option>
                            <option value="laticinios">🥛 Laticínios</option>
                            <option value="carnes">🥩 Carnes</option>
                            <option value="padaria">🍞 Padaria</option>
                            <option value="bebidas">🥤 Bebidas</option>
                            <option value="limpeza">🧹 Limpeza</option>
                            <option value="higiene">🧴 Higiene</option>
                            <option value="outros">📦 Outros</option>
                        </select>
                    </div>
                </div>
                
                <ul id="lista" class="shopping-list">
                    <!-- Itens serão inseridos via JS -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h3>Sua lista está vazia</h3>
                    <p>Adicione itens para começar suas compras</p>
                </div>
            </div>

            <!-- Área de Adição -->
            <div class="add-section">
                <div class="add-container">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="item" 
                            placeholder="O que você precisa comprar?"
                            autocomplete="off"
                            aria-label="Novo item para adicionar à lista"
                        >
                        <select id="itemCategory" class="item-category-select" aria-label="Categoria do item">
                            <option value="hortifruti">🍎</option>
                            <option value="laticinios">🥛</option>
                            <option value="carnes">🥩</option>
                            <option value="padaria">🍞</option>
                            <option value="bebidas">🥤</option>
                            <option value="limpeza">🧹</option>
                            <option value="higiene">🧴</option>
                            <option value="outros" selected>📦</option>
                        </select>
                    </div>
                    <button onclick="adicionarItem()" class="add-btn" aria-label="Adicionar item">
                        <span class="add-icon">+</span>
                        <span class="add-text">Adicionar</span>
                    </button>
                </div>
                <div class="input-hint">
                    <span class="hint-icon">💡</span>
                    <span class="hint-text">Pressione Enter para adicionar rapidamente</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
    
    <script>
        // Detecção de Status Online/Offline
        let isOnline = navigator.onLine;
        const offlineIndicator = document.getElementById('offlineIndicator');
        const syncStatus = document.getElementById('syncStatus');
        
        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            
            if (!isOnline) {
                offlineIndicator.classList.remove('hidden');
                syncStatus.className = 'sync-status offline';
                syncStatus.setAttribute('title', 'Offline - Alterações serão sincronizadas depois');
                document.querySelector('.sync-icon').textContent = '📶';
            } else {
                offlineIndicator.classList.add('hidden');
                syncStatus.className = 'sync-status synced';
                syncStatus.setAttribute('title', 'Online - Sincronizado');
                document.querySelector('.sync-icon').textContent = '☁️';
                
                // Sincronizar dados pendentes quando voltar online
                if (typeof window.sincronizarDadosPendentes === 'function') {
                    window.sincronizarDadosPendentes();
                }
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('✅ ServiceWorker registrado:', registration.scope);
                        
                        // Verificar atualizações
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Nova versão disponível
                                    if (confirm('Nova versão disponível! Atualizar agora?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.log('❌ Falha no ServiceWorker:', error);
                    });
            });
        }

        // Melhoria UX: Adicionar item com Enter
        document.addEventListener('DOMContentLoaded', () => {
            updateOnlineStatus();
            
            const inputItem = document.getElementById('item');
            if (inputItem) {
                inputItem.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        adicionarItem();
                    }
                });
            }
            
            // Carregar nome do usuário (exemplo)
            const userEmail = localStorage.getItem('userEmail') || 'Usuário';
            const userName = userEmail.split('@')[0];
            document.getElementById('userDisplayName').textContent = userName;
            document.getElementById('userAvatar').textContent = userName.charAt(0).toUpperCase() + '👤';
            
            // Inicializar filtro de categorias
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                filtrarPorCategoria(e.target.value);
            });
        });

        // Sistema de Categorias
        const categorias = {
            hortifruti: { nome: 'Hortifruti', emoji: '🍎', cor: '#10b981', bgLight: 'rgba(16, 185, 129, 0.1)' },
            laticinios: { nome: 'Laticínios', emoji: '🥛', cor: '#3b82f6', bgLight: 'rgba(59, 130, 246, 0.1)' },
            carnes: { nome: 'Carnes', emoji: '🥩', cor: '#ef4444', bgLight: 'rgba(239, 68, 68, 0.1)' },
            padaria: { nome: 'Padaria', emoji: '🍞', cor: '#f59e0b', bgLight: 'rgba(245, 158, 11, 0.1)' },
            bebidas: { nome: 'Bebidas', emoji: '🥤', cor: '#06b6d4', bgLight: 'rgba(6, 182, 212, 0.1)' },
            limpeza: { nome: 'Limpeza', emoji: '🧹', cor: '#8b5cf6', bgLight: 'rgba(139, 92, 246, 0.1)' },
            higiene: { nome: 'Higiene', emoji: '🧴', cor: '#ec4899', bgLight: 'rgba(236, 72, 153, 0.1)' },
            outros: { nome: 'Outros', emoji: '📦', cor: '#6b7280', bgLight: 'rgba(107, 114, 128, 0.1)' }
        };

        function filtrarPorCategoria(categoria) {
            const itens = document.querySelectorAll('.shopping-list li');
            itens.forEach(item => {
                if (categoria === 'all' || item.dataset.categoria === categoria) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Função auxiliar para contador
        function atualizarContador() {
            const lista = document.getElementById('lista');
            const contador = document.getElementById('itemCount');
            const emptyState = document.getElementById('emptyState');
            
            if (lista && contador && emptyState) {
                const itensVisiveis = Array.from(lista.children).filter(li => li.style.display !== 'none');
                const qtdItens = itensVisiveis.length;
                const qtdTotal = lista.children.length;
                
                if (qtdTotal === 0) {
                    contador.textContent = '0 itens';
                    emptyState.style.display = 'flex';
                    lista.style.display = 'none';
                } else {
                    contador.textContent = `${qtdTotal} ${qtdTotal === 1 ? 'item' : 'itens'}`;
                    emptyState.style.display = 'none';
                    lista.style.display = 'block';
                }
            }
        }

        // Sincronização de Status
        window.sincronizarDadosPendentes = function() {
            const pendingChanges = JSON.parse(localStorage.getItem('pendingChanges') || '[]');
            
            if (pendingChanges.length > 0) {
                syncStatus.className = 'sync-status syncing';
                document.querySelector('.sync-icon').textContent = '🔄';
                
                // Processar mudanças pendentes
                Promise.all(pendingChanges.map(change => {
                    return fetch('/api/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(change)
                    });
                }))
                .then(() => {
                    localStorage.setItem('pendingChanges', '[]');
                    syncStatus.className = 'sync-status synced';
                    document.querySelector('.sync-icon').textContent = '☁️';
                })
                .catch(error => {
                    console.error('Erro na sincronização:', error);
                    syncStatus.className = 'sync-status error';
                    document.querySelector('.sync-icon').textContent = '⚠️';
                });
            }
        };
    </script>
</body>
</html>
