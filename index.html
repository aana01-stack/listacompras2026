<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#361134">
    <meta name="description" content="Lista de Compras 2026 - Gerencie sua lista compartilhada">
    <title>Lista 2026 - Minha Lista de Compras</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="src/css/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="src/css/icons/Favicon-512.png">
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
    <!-- Loader -->
    <div id="loader" class="loader-overlay" aria-hidden="true" hidden>
        <div class="loader-spinner"></div>
        <p class="loader-text">Carregando...</p>
    </div>

    <!-- Container Principal -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <i class="fas fa-user-circle user-avatar"></i>
                <div class="user-details">
                    <span id="user-name" class="user-name">Usuário</span>
                    <span id="user-email" class="user-email">email@exemplo.com</span>
                </div>
            </div>
            
            <div class="header-actions">
                <button onclick="compartilharLista()" class="btn-icon" aria-label="Compartilhar lista" title="Compartilhar">
                    <i class="fas fa-share-alt"></i>
                </button>
                <button onclick="logout()" class="btn-logout" aria-label="Sair da conta" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <!-- Título -->
        <div class="title-section">
            <h1 class="titulo">
                <i class="fas fa-shopping-cart"></i>
                Minha Lista de Compras
            </h1>
            <p id="data-atualizacao" class="update-date"></p>
        </div>

        <!-- Estatísticas Rápidas -->
        <div class="stats-bar">
            <div class="stat-item">
                <span id="total-itens" class="stat-number">0</span>
                <span class="stat-label">Itens</span>
            </div>
            <div class="stat-item">
                <span id="itens-comprados" class="stat-number">0</span>
                <span class="stat-label">Comprados</span>
            </div>
            <div class="stat-item">
                <span id="categorias-count" class="stat-number">0</span>
                <span class="stat-label">Categorias</span>
            </div>
        </div>

        <!-- Barra de Pesquisa e Filtros -->
        <div class="search-filter-bar">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" 
                       id="pesquisa" 
                       placeholder="Pesquisar itens..."
                       aria-label="Pesquisar itens da lista"
                       oninput="filtrarItens()">
                <button onclick="limparPesquisa()" class="clear-search" aria-label="Limpar pesquisa" hidden>
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="filter-buttons">
                <button onclick="filtrarPorCategoria('todos')" class="filter-btn active" data-filter="todos">
                    Todos
                </button>
                <button onclick="filtrarPorCategoria('pendentes')" class="filter-btn" data-filter="pendentes">
                    Pendentes
                </button>
                <button onclick="filtrarPorCategoria('comprados')" class="filter-btn" data-filter="comprados">
                    Comprados
                </button>
            </div>
        </div>

        <!-- Lista de Compras -->
        <div id="lista-container" class="lista-container">
            <ul id="lista" class="shopping-list" role="list" aria-label="Lista de compras">
                <!-- Itens serão inseridos dinamicamente -->
            </ul>
            
            <!-- Estado Vazio -->
            <div id="empty-state" class="empty-state" hidden>
                <i class="fas fa-shopping-basket empty-icon"></i>
                <h3>Sua lista está vazia</h3>
                <p>Adicione itens para começar suas compras!</p>
            </div>
        </div>

        <!-- Adicionar Item -->
        <div class="add-item-section">
            <div class="add-item-form">
                <input type="text" 
                       id="item" 
                       placeholder="O que você precisa comprar?"
                       aria-label="Nome do novo item"
                       autocomplete="off">
                <select id="categoria" aria-label="Categoria do item" class="categoria-select">
                    <option value="auto">Auto classificar</option>
                    <option value="carnes">🥩 Carnes</option>
                    <option value="vegetais">🥬 Vegetais</option>
                    <option value="frutas">🍎 Frutas</option>
                    <option value="laticinios">🧀 Laticínios</option>
                    <option value="padaria">🍞 Padaria</option>
                    <option value="bebidas">🥤 Bebidas</option>
                    <option value="limpeza">🧹 Limpeza</option>
                    <option value="higiene">🧴 Higiene</option>
                    <option value="enlatados">🥫 Enlatados</option>
                    <option value="graos">🌾 Grãos</option>
                    <option value="temperos">🌶️ Temperos</option>
                    <option value="outros">📦 Outros</option>
                </select>
                <div class="quantidade-control">
                    <button onclick="alterarQuantidade(-1)" class="qty-btn" aria-label="Diminuir quantidade">-</button>
                    <input type="number" id="quantidade" value="1" min="1" max="99" aria-label="Quantidade">
                    <button onclick="alterarQuantidade(1)" class="qty-btn" aria-label="Aumentar quantidade">+</button>
                </div>
                <button onclick="adicionarItem()" class="btn-add" aria-label="Adicionar item à lista">
                    <i class="fas fa-plus"></i>
                    Adicionar
                </button>
            </div>
            
            <!-- Sugestões Rápidas -->
            <div class="quick-suggestions">
                <span class="suggestion-label">Sugestões:</span>
                <button onclick="adicionarSugestao('Arroz')" class="suggestion-chip">Arroz</button>
                <button onclick="adicionarSugestao('Feijão')" class="suggestion-chip">Feijão</button>
                <button onclick="adicionarSugestao('Leite')" class="suggestion-chip">Leite</button>
                <button onclick="adicionarSugestao('Pão')" class="suggestion-chip">Pão</button>
                <button onclick="adicionarSugestao('Ovos')" class="suggestion-chip">Ovos</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
    
    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o ServiceWorker:', error);
                    });
            });
        }

        // Função de Logout
        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                // Limpar dados da sessão
                localStorage.removeItem('userToken');
                localStorage.removeItem('userData');
                sessionStorage.clear();
                
                // Redirecionar para login
                window.location.href = 'login.html';
            }
        }

        // Funções auxiliares
        function compartilharLista() {
            if (navigator.share) {
                navigator.share({
                    title: 'Minha Lista de Compras',
                    text: 'Veja minha lista de compras!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert('Compartilhamento não suportado neste navegador');
            }
        }

        function alterarQuantidade(delta) {
            const qtyInput = document.getElementById('quantidade');
            let value = parseInt(qtyInput.value) + delta;
            qtyInput.value = Math.max(1, Math.min(99, value));
        }

        function limparPesquisa() {
            document.getElementById('pesquisa').value = '';
            filtrarItens();
        }

        function adicionarSugestao(item) {
            document.getElementById('item').value = item;
            document.getElementById('quantidade').value = 1;
            adicionarItem();
        }
    </script>
</body>
</html>
